<!DOCTYPE html>
<html lang="en" data-theme="sunlit">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E86A33" id="metaThemeColor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Momentum" />
  <title>Momentum — Habit &amp; Challenge Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    /* =========================================================
       MOMENTUM v7 — WARM TACTILE COMPANION DESIGN SYSTEM
       ========================================================= */
    :root, [data-theme="sunlit"] {
      color-scheme: light;
      --bg-app: #FAF6F0;
      --bg-card: #FFFFFF;
      --bg-soft: #F3ECE2;
      --bg-soft-hover: #EAE0D2;
      --border: #E8DED0;
      --border-strong: #D8C9B5;
      --text: #1F1A17;
      --text-2: #5D534C;
      --text-3: #8D8177;
      --accent: #E86A33;
      --accent-dark: #CC5420;
      --accent-soft: rgba(232, 106, 51, 0.13);
      --accent-grad: linear-gradient(135deg, #F48442 0%, #D94E2A 100%);
      --success: #1D9A6C;
      --success-soft: rgba(29, 154, 108, 0.14);
      --amber: #D98A16;
      --amber-soft: rgba(217, 138, 22, 0.16);
      --info: #3B82F6;
      --info-soft: rgba(59, 130, 246, 0.14);
      --danger: #D94242;
      --danger-soft: rgba(217, 66, 66, 0.12);
      --shadow-sm: 0 2px 8px rgba(45, 30, 18, 0.05);
      --shadow-md: 0 8px 24px rgba(45, 30, 18, 0.08);
      --shadow-lg: 0 14px 36px rgba(35, 22, 12, 0.16);
      --scrim: rgba(25, 18, 14, 0.52);
      --heat-0: #EFE8DE;
      --heat-1: #FBD3BC;
      --heat-2: #F4A57B;
      --heat-3: #EC7945;
      --heat-4: #C94D1E;
      --nav-bg: rgba(255, 255, 255, 0.94);
    }

    [data-theme="twilight"] {
      color-scheme: dark;
      --bg-app: #16131D;
      --bg-card: #211C2C;
      --bg-soft: #2C263A;
      --bg-soft-hover: #362F47;
      --border: #352E46;
      --border-strong: #4A4061;
      --text: #F7F2EC;
      --text-2: #C2B8CC;
      --text-3: #8D839A;
      --accent: #F27E49;
      --accent-dark: #D96532;
      --accent-soft: rgba(242, 126, 73, 0.18);
      --accent-grad: linear-gradient(135deg, #F58D54 0%, #D95332 100%);
      --success: #2CC28B;
      --success-soft: rgba(44, 194, 139, 0.18);
      --amber: #F0AE3A;
      --amber-soft: rgba(240, 174, 58, 0.18);
      --info: #60A5FA;
      --info-soft: rgba(96, 165, 250, 0.18);
      --danger: #F26666;
      --danger-soft: rgba(242, 102, 102, 0.18);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.36);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
      --scrim: rgba(8, 6, 14, 0.72);
      --heat-0: #2C263A;
      --heat-1: #5B3835;
      --heat-2: #8E4A36;
      --heat-3: #C76138;
      --heat-4: #F27E49;
      --nav-bg: rgba(33, 28, 44, 0.94);
    }

    [data-theme="midnight"] {
      color-scheme: dark;
      --bg-app: #000000;
      --bg-card: #121216;
      --bg-soft: #1D1D24;
      --bg-soft-hover: #282832;
      --border: #25252E;
      --border-strong: #3A3A47;
      --text: #F8F8FA;
      --text-2: #B6B6C2;
      --text-3: #7A7A88;
      --accent: #F27E49;
      --accent-dark: #D96532;
      --accent-soft: rgba(242, 126, 73, 0.2);
      --accent-grad: linear-gradient(135deg, #F58D54 0%, #D95332 100%);
      --success: #2CC28B;
      --success-soft: rgba(44, 194, 139, 0.2);
      --amber: #F0AE3A;
      --amber-soft: rgba(240, 174, 58, 0.2);
      --info: #60A5FA;
      --info-soft: rgba(96, 165, 250, 0.2);
      --danger: #F26666;
      --danger-soft: rgba(242, 102, 102, 0.2);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.65);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.85);
      --scrim: rgba(0, 0, 0, 0.82);
      --heat-0: #1C1C22;
      --heat-1: #543125;
      --heat-2: #8C452B;
      --heat-3: #C95E32;
      --heat-4: #F27E49;
      --nav-bg: rgba(16, 16, 20, 0.95);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      background: var(--bg-app);
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      min-height: 100%;
      background: var(--bg-app);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    /* Prevent icons/spans inside buttons from stealing touch events */
    button svg, button svg *, button span {
      pointer-events: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      padding: 0;
      touch-action: manipulation;
    }

    input, textarea, select {
      font-family: inherit;
      color: var(--text);
      font-size: 15px;
    }

    .app-shell {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Error Banner */
    .error-banner {
      display: none;
      background: var(--danger);
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 950;
    }
    .error-banner.show { display: flex; }
    .error-banner button {
      background: rgba(255,255,255,0.22);
      color: #fff;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-app);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(232, 106, 51, 0.32);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--text-3);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn:active { transform: scale(0.93); }
    .icon-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Main Content */
    .main-view {
      flex: 1;
      padding: 14px 16px calc(155px + env(safe-area-inset-bottom, 0px));
      position: relative;
      z-index: 1;
      overflow-x: clip;
    }

    /* Date Bar & 7-Day Week Strip */
    .date-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .date-nav-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--bg-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      flex-shrink: 0;
    }
    .date-nav-btn:active { transform: scale(0.92); background: var(--bg-soft-hover); }

    .date-center {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
    }

    .date-picker-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--bg-soft);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      max-width: 100%;
    }

    .date-picker-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .today-jump-btn {
      padding: 5px 10px;
      border-radius: 99px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11.5px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7px 2px 6px;
      border-radius: 13px;
      background: var(--bg-soft);
      border: 1.5px solid transparent;
      gap: 2px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .day-pill:active { transform: scale(0.94); }
    .day-pill.is-today { border-color: var(--accent); }
    .day-pill.is-selected {
      background: var(--accent-grad);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(232, 106, 51, 0.3);
    }
    .day-pill-wd {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.72;
      text-transform: uppercase;
    }
    .day-pill-num {
      font-size: 13.5px;
      font-weight: 800;
    }
    .day-pill-pct {
      font-size: 9.5px;
      font-weight: 700;
      opacity: 0.85;
      line-height: 1;
    }
    .day-pill-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: transparent;
    }
    .day-pill.has-done .day-pill-dot { background: var(--success); }
    .day-pill.has-part .day-pill-dot { background: var(--amber); }
    .day-pill.is-selected .day-pill-dot { background: rgba(255,255,255,0.9); }

    /* Cards & Bento Blocks */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    /* Daily Percentage Hero Card with Spark Companion */
    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .spark-wrap {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      animation: floatSpark 3.2s ease-in-out infinite;
    }

    @keyframes floatSpark {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .hero-copy {
      min-width: 0;
      flex: 1;
    }

    .hero-greeting {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 3px;
    }

    .hero-sub {
      font-size: 12.5px;
      color: var(--text-2);
      font-weight: 500;
    }

    .ring-box {
      position: relative;
      width: 66px;
      height: 66px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-box svg {
      width: 66px;
      height: 66px;
      transform: rotate(-90deg);
    }

    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
    }
    .ring-label small {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-3);
      margin-top: 2px;
    }

    .hero-bar-wrap {
      margin-top: 12px;
      height: 8px;
      border-radius: 99px;
      background: var(--bg-soft);
      overflow: hidden;
    }

    .hero-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent-grad);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .hero-bar-fill.complete {
      background: linear-gradient(90deg, #1D9A6C, #2CC28B);
    }

    .hero-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--bg-soft);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-2);
    }
    .mini-pill.good { background: var(--success-soft); color: var(--success); }
    .mini-pill.accent { background: var(--accent-soft); color: var(--accent); }
    .mini-pill.amber { background: var(--amber-soft); color: var(--amber); }

    /* Challenge Spotlight Banner on Today */
    .challenge-spotlight {
      background: var(--accent-grad);
      color: #FFFFFF;
      border-radius: 22px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 22px rgba(217, 78, 42, 0.28);
    }

    .cs-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cs-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .cs-kicker {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.88;
      margin-bottom: 2px;
    }

    .cs-title {
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cs-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .cs-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .cs-btn:active { background: rgba(255,255,255,0.32); }

    .cs-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .cs-track {
      height: 7px;
      background: rgba(255,255,255,0.26);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }

    .cs-fill {
      height: 100%;
      background: #FFFFFF;
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .cs-switcher {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-top: 10px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .cs-switcher::-webkit-scrollbar { display: none; }

    .cs-chip {
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cs-chip.active {
      background: #FFFFFF;
      color: #C94D1E;
    }

    /* Section Header */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 2px 10px;
    }

    .sec-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sec-badge {
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--bg-soft);
      color: var(--text-2);
      font-size: 11.5px;
      font-weight: 800;
    }

    .pill-cta {
      padding: 6px 12px;
      border-radius: 99px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-cta:active { transform: scale(0.95); }

    /* Horizontal Scroll Chips */
    .chip-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 0 8px;
      margin-bottom: 6px;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 7px 13px;
      border-radius: 99px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.14s ease;
    }
    .filter-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 3px 10px rgba(232, 106, 51, 0.25);
    }

    /* Habit Cards with Liquid Fill */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .habit-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 13px 12px 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, transform 0.12s ease;
    }

    .habit-card.state-done { border-color: rgba(29, 154, 108, 0.45); }
    .habit-card.state-min { border-color: rgba(217, 138, 22, 0.5); }
    .habit-card.state-freeze { border-color: rgba(59, 130, 246, 0.45); }
    .habit-card.state-skip { opacity: 0.72; }

    .habit-liquid {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--success-soft);
      pointer-events: none;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 0;
    }
    .habit-card.state-min .habit-liquid { background: var(--amber-soft); }
    .habit-card.state-freeze .habit-liquid { background: var(--info-soft); }

    .habit-main {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }

    .habit-emoji {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: var(--bg-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .habit-info {
      min-width: 0;
      flex: 1;
    }

    .habit-title {
      font-size: 14.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-card.state-done .habit-title {
      text-decoration: line-through;
      opacity: 0.78;
    }

    .habit-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--text-3);
      font-weight: 600;
    }

    .habit-note-preview {
      font-size: 11.5px;
      color: var(--text-2);
      margin-top: 4px;
      background: var(--bg-soft);
      padding: 3px 8px;
      border-radius: 8px;
      display: inline-block;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-controls {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .check-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      border: 2px solid var(--border-strong);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-3);
      transition: all 0.15s ease;
    }
    .check-btn:active { transform: scale(0.9); }
    .check-btn.done {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .check-btn.min {
      background: var(--amber);
      border-color: var(--amber);
      color: #fff;
    }
    .check-btn.freeze {
      background: var(--info);
      border-color: var(--info);
      color: #fff;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      background: var(--bg-soft);
      border-radius: 13px;
      padding: 3px;
      gap: 3px;
    }
    .step-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--bg-card);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }
    .step-btn.plus { background: var(--accent); color: #fff; }
    .step-val {
      min-width: 34px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .timer-pill-btn {
      padding: 8px 12px;
      border-radius: 13px;
      background: var(--accent);
      color: #fff;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .timer-pill-btn.done { background: var(--success); }

    .more-btn {
      width: 34px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-3);
    }
    .more-btn:active { background: var(--bg-soft); color: var(--text); }

    /* Accordion Completed Drawer */
    .completed-toggle {
      width: 100%;
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 16px;
      background: var(--bg-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-2);
    }

    /* Routines */
    .routine-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
    }
    .routine-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .routine-title-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      text-align: left;
    }
    .routine-steps {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .routine-step-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-soft);
      text-align: left;
      font-size: 13.5px;
      font-weight: 600;
    }
    .routine-step-btn.done {
      background: var(--success-soft);
      text-decoration: line-through;
      color: var(--text-2);
    }

    /* Quick Daily To-Dos */
    .todo-add-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .text-input, .textarea-input, .select-input {
      width: 100%;
      background: var(--bg-soft);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 11px 13px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .text-input:focus, .textarea-input:focus, .select-input:focus {
      border-color: var(--accent);
      background: var(--bg-card);
    }
    .textarea-input {
      min-height: 115px;
      resize: vertical;
      line-height: 1.55;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 8px;
    }
    .todo-check {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      border: 2px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .todo-check.done {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .todo-text {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--text-3);
    }

    /* Challenges Tab */
    .tracker-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .tracker-card.active-card {
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(232, 106, 51, 0.14);
    }
    .tracker-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tracker-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .small-action-btn {
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--bg-soft);
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 34px;
    }
    .small-action-btn.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .small-action-btn.accent {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-top: 12px;
    }
    .day-tile {
      aspect-ratio: 1;
      border-radius: 8px;
      background: var(--bg-soft);
      font-size: 10px;
      font-weight: 800;
      color: var(--text-3);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid transparent;
    }
    .day-tile.done { background: var(--success); color: #fff; }
    .day-tile.min { background: var(--amber); color: #fff; }
    .day-tile.freeze { background: var(--info); color: #fff; }
    .day-tile.missed { background: var(--danger-soft); color: var(--danger); }
    .day-tile.today { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .day-tile.today.done { background: var(--success); color: #fff; border-color: var(--text); }

    /* Journal Tab */
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 10px 0 12px;
    }
    .mood-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 9px 4px;
      border-radius: 14px;
      background: var(--bg-soft);
      border: 2px solid transparent;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
    }
    .mood-btn .m-em { font-size: 22px; line-height: 1.1; }
    .mood-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .journal-entry-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
    }
    .je-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .je-body {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Insights Bento */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }
    .stat-num {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-top: 4px;
    }
    .stat-lbl {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 700;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 4px;
      margin-top: 10px;
    }
    .heat-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      background: var(--heat-0);
    }
    .heat-cell.l1 { background: var(--heat-1); }
    .heat-cell.l2 { background: var(--heat-2); }
    .heat-cell.l3 { background: var(--heat-3); }
    .heat-cell.l4 { background: var(--heat-4); }

    .week-bars {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      align-items: end;
      height: 110px;
      margin-top: 12px;
      padding-top: 10px;
    }
    .wbar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      height: 100%;
      justify-content: flex-end;
    }
    .wbar-track {
      width: 100%;
      max-width: 28px;
      height: 76px;
      border-radius: 9px;
      background: var(--bg-soft);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    .wbar-fill {
      width: 100%;
      background: var(--accent-grad);
      border-radius: 9px;
      transition: height 0.3s ease;
    }

    /* Empty States */
    .empty-card {
      background: var(--bg-card);
      border: 1.5px dashed var(--border-strong);
      border-radius: 22px;
      padding: 24px 18px;
      text-align: center;
      margin-bottom: 12px;
    }
    .empty-emoji { font-size: 36px; margin-bottom: 8px; }
    .empty-title { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
    .empty-desc { font-size: 13px; color: var(--text-2); margin-bottom: 14px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px 16px;
      border-radius: 15px;
      font-size: 14px;
      font-weight: 800;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent-grad); color: #fff; box-shadow: 0 5px 14px rgba(232, 106, 51, 0.28); }
    .btn-soft { background: var(--bg-soft); color: var(--text); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-danger-solid { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-full { width: 100%; }

    /* Settings Rows */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; padding-bottom: 2px; }
    .setting-row:first-child { padding-top: 2px; }
    .setting-lbl { font-size: 14px; font-weight: 700; }
    .setting-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .theme-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .theme-opt {
      padding: 10px 6px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg-soft);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .theme-opt.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      right: max(18px, calc(50% - 242px));
      bottom: calc(82px + env(safe-area-inset-bottom, 0px));
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--accent-grad);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(217, 78, 42, 0.4);
      z-index: 60;
      transition: transform 0.16s ease, opacity 0.16s ease;
    }
    .fab:active { transform: scale(0.92); }
    .fab.hidden { display: none; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 520px;
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      z-index: 70;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      border-radius: 14px;
      color: var(--text-3);
      font-size: 10.5px;
      font-weight: 700;
      transition: all 0.14s ease;
    }
    .nav-btn .nav-em { font-size: 19px; line-height: 1.1; }
    .nav-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Bottom Sheets & Overlays */
    .overlay {
      display: none;
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: var(--scrim);
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .overlay.open {
      display: flex !important;
      pointer-events: auto !important;
    }
    .overlay.center-mode {
      align-items: center;
      padding: 20px;
    }

    #sheetOverlay { z-index: 300; }
    #timerOverlay { z-index: 400; }
    #pinLockOverlay { z-index: 500; background: var(--bg-app); }
    #pinSetupOverlay { z-index: 600; }
    #confirmOverlay { z-index: 900; }

    .sheet {
      width: 100%;
      max-width: 520px;
      max-height: 88dvh;
      background: var(--bg-card);
      border-radius: 26px 26px 0 0;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetUp 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes sheetUp {
      from { transform: translateY(28px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-head {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .sheet-title { font-size: 16.5px; font-weight: 800; }
    .sheet-close {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--bg-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
    }

    .sheet-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .sheet-foot {
      padding: 12px 18px calc(16px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg-card);
    }

    .field { margin-bottom: 14px; }
    .field-lbl {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .emoji-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .emoji-pick {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--bg-soft);
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
    }
    .emoji-pick.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .action-tile {
      padding: 12px;
      border-radius: 15px;
      background: var(--bg-soft);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
    }
    .action-tile.danger { background: var(--danger-soft); color: var(--danger); }

    /* PIN Keypad */
    .pin-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 18px 0 12px;
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      background: transparent;
      transition: all 0.14s ease;
    }
    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.1);
    }
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    .pin-key {
      height: 54px;
      border-radius: 16px;
      background: var(--bg-soft);
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pin-key:active { background: var(--accent-soft); color: var(--accent); transform: scale(0.95); }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .shake { animation: shakeAnim 0.28s ease; }

    /* Focus Timer */
    .timer-display {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-align: center;
      margin: 14px 0;
      font-variant-numeric: tabular-nums;
    }

    /* Privacy Blur */
    body.privacy-mode .privacy-sensitive {
      filter: blur(7px);
      -webkit-filter: blur(7px);
      transition: filter 0.18s ease;
      user-select: none;
    }
    body.privacy-mode .privacy-sensitive:active {
      filter: none;
      -webkit-filter: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(92px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(16px);
      background: #1F1A17;
      color: #FFFBF5;
      padding: 11px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: 90vw;
      text-align: center;
    }
    [data-theme="twilight"] .toast, [data-theme="midnight"] .toast {
      background: #F7F2EC;
      color: #16131D;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .muted { color: var(--text-2); }
    .small { font-size: 12.5px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-gap { display: flex; align-items: center; gap: 8px; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Safety Error Banner -->
    <div id="errorBanner" class="error-banner" role="alert">
      <span id="errorBannerMsg">Something went wrong.</span>
      <button type="button" data-action="dismiss-error">OK</button>
    </div>

    <!-- Top Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M13 2L4.5 13H11.5L10 22L19.5 10.5H12.5L13 2Z" fill="#FFFBF5"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Momentum</div>
          <div class="brand-sub" id="headerSub">Ready for a great day</div>
        </div>
      </div>
      <div class="topbar-actions">

  <script>
  (function () {
    'use strict';

    /* =========================================================
       1. CONSTANTS & HELPERS
       ========================================================= */
    const STORAGE_KEY = 'momentum_v7_state';
    const LEGACY_KEYS = [
      'momentum_v65_data', 'momentum_v64_data', 'momentum_v63_data',
      'momentum_v62_data', 'momentum_v61_data', 'momentum_v6_data',
      'momentum_v59_data', 'momentum_v58_data', 'momentum_v57_data',
      'momentum_v56_data', 'momentum_v55_data', 'momentum_v54_data',
      'momentum_v53_data', 'momentum_v5_data', 'momentum_v4_data'
    ];

    const CATEGORIES = [
      { id: 'all', label: 'All', emoji: '✨' },
      { id: 'office', label: 'Office', emoji: '🏢' },
      { id: 'personal', label: 'Personal', emoji: '🌿' },
      { id: 'health', label: 'Health', emoji: '💪' },
      { id: 'study', label: 'Study', emoji: '📚' },
      { id: 'mind', label: 'Mind', emoji: '🧠' }
    ];

    const MOODS = [
      { id: 'amazing', emoji: '🤩', label: 'Amazing' },
      { id: 'good', emoji: '😊', label: 'Good' },
      { id: 'calm', emoji: '😌', label: 'Calm' },
      { id: 'meh', emoji: '😕', label: 'Meh' },
      { id: 'tough', emoji: '😫', label: 'Tough' }
    ];

    const HABIT_EMOJIS = ['💧','🏃','📚','🧘','💼','💻','🥗','😴','✍️','📵','🎯','🧹','🎸','🚶','☀️','🔥','🧠','💪'];
    const CHALLENGE_EMOJIS = ['🏆','🏢','⚡','🔥','🚀','🌿','📚','💪','🎯','🌟'];
    const SKIP_REASONS = ['Tired / Low energy', 'Busy day / Travel', 'Unwell', 'Forgot', 'Rest day'];

    const THEME_META = {
      sunlit: { color: '#E86A33', icon: '☀️', label: 'Sunlit Paper' },
      twilight: { color: '#16131D', icon: '🌅', label: 'Cozy Twilight' },
      midnight: { color: '#000000', icon: '🌌', label: 'Midnight Ink' }
    };

    function uid(prefix) {
      return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\x22/g, '&quot;')
        .replace(/\x27/g, '&#39;');
    }

    function vibrate(ms) {
      try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {}
    }

    /* Pure Local Calendar Date Math (Zero UTC toISOString bugs!) */
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function formatLocalDate(d) {
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    function parseLocalDate(str) {
      if (!str || typeof str !== 'string') return new Date();
      const parts = str.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return new Date();
      return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
    }

    function addDays(dateStr, delta) {
      const d = parseLocalDate(dateStr);
      d.setDate(d.getDate() + delta);
      return formatLocalDate(d);
    }

    function getEffectiveToday(cutoffHour) {
      const now = new Date();
      const cut = Number(cutoffHour) || 0;
      if (cut > 0 && now.getHours() < cut) {
        now.setDate(now.getDate() - 1);
      }
      return formatLocalDate(now);
    }

    function friendlyDate(dateStr, todayStr) {
      const d = parseLocalDate(dateStr);
      const wd = d.toLocaleDateString('en-IN', { weekday: 'short' });
      const mo = d.toLocaleDateString('en-IN', { month: 'short' });
      const day = d.getDate();
      if (dateStr === todayStr) return 'Today · ' + wd + ', ' + day + ' ' + mo;
      if (dateStr === addDays(todayStr, -1)) return 'Yesterday · ' + day + ' ' + mo;
      if (dateStr === addDays(todayStr, 1)) return 'Tomorrow · ' + day + ' ' + mo;
      return wd + ', ' + day + ' ' + mo + ' ' + d.getFullYear();
    }

    /* =========================================================
       2. STATE MANAGEMENT & SAFE MIGRATION
       ========================================================= */
    function createDefaultState() {
      const today = getEffectiveToday(0);
      return {
        version: 7,
        initialized: true,
        settings: {
          theme: 'sunlit',
          privacyBlur: false,
          cutoffHour: 0,
          pinEnabled: false,
          pin: '',
          showEmptyChallengeBanner: true
        },
        habits: [
          { id: 'hab_water', name: 'Morning Hydration', emoji: '💧', category: 'personal', type: 'quant', target: 8, unit: 'glasses', archived: false },
          { id: 'hab_deepwork', name: 'Office Deep Focus', emoji: '💼', category: 'office', type: 'timed', target: 45, unit: 'min', archived: false },
          { id: 'hab_walk', name: 'Daily Movement', emoji: '🏃', category: 'health', type: 'binary', target: 1, unit: '', archived: false },
          { id: 'hab_read', name: 'Study / Reading', emoji: '📚', category: 'study', type: 'quant', target: 20, unit: 'pages', archived: false }
        ],
        logs: {},
        trackers: [
          {
            id: 'trk_office90',
            name: '90-Day Office & Growth',
            emoji: '🏢',
            days: 90,
            startDate: today,
            syncMode: 'category',
            syncCategory: 'office',
            syncHabitIds: [],
            syncThreshold: 100,
            overrides: {}
          },
          {
            id: 'trk_sprint30',
            name: '30-Day Personal Sprint',
            emoji: '⚡',
            days: 30,
            startDate: today,
            syncMode: 'all',
            syncCategory: 'personal',
            syncHabitIds: [],
            syncThreshold: 70,
            overrides: {}
          }
        ],
        activeTrackerId: 'trk_office90',
        routines: [
          {
            id: 'rtn_morning',
            name: 'Morning Kickstart',
            emoji: '🌅',
            steps: [
              { id: 'st_1', text: 'Drink a glass of water' },
              { id: 'st_2', text: 'Plan top 3 priorities' },
              { id: 'st_3', text: '5 min stretch or sunlight' }
            ]
          }
        ],
        routineLogs: {},
        todos: {},
        journals: {}
      };
    }

    function sanitizeState(raw) {
      if (!raw || typeof raw !== 'object') return createDefaultState();
      const s = {
        version: 7,
        initialized: true,
        settings: Object.assign({
          theme: 'sunlit',
          privacyBlur: false,
          cutoffHour: 0,
          pinEnabled: false,
          pin: '',
          showEmptyChallengeBanner: true
        }, raw.settings || {}),
        habits: Array.isArray(raw.habits) ? raw.habits.filter(Boolean).map(h => ({
          id: String(h.id || uid('hab')),
          name: String(h.name || 'Habit'),
          emoji: String(h.emoji || '✨'),
          category: String(h.category || 'personal'),
          type: ['binary', 'quant', 'timed', 'quit'].includes(h.type) ? h.type : 'binary',
          target: Math.max(1, Number(h.target) || 1),
          unit: String(h.unit || ''),
          archived: Boolean(h.archived)
        })) : [],
        logs: (raw.logs && typeof raw.logs === 'object' && !Array.isArray(raw.logs)) ? raw.logs : {},
        trackers: Array.isArray(raw.trackers) ? raw.trackers.filter(Boolean).map(t => ({
          id: String(t.id || uid('trk')),
          name: String(t.name || 'Challenge'),
          emoji: String(t.emoji || '🏆'),
          days: Math.min(1000, Math.max(1, Number(t.days || t.duration || 30))),
          startDate: (typeof t.startDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.startDate)) ? t.startDate : getEffectiveToday(0),
          syncMode: ['all', 'category', 'habits', 'manual'].includes(t.syncMode) ? t.syncMode : 'all',
          syncCategory: String(t.syncCategory || 'office'),
          syncHabitIds: Array.isArray(t.syncHabitIds) ? t.syncHabitIds : [],
          syncThreshold: Math.min(100, Math.max(10, Number(t.syncThreshold) || 70)),
          overrides: (t.overrides && typeof t.overrides === 'object') ? t.overrides : {}
        })) : [],
        activeTrackerId: raw.activeTrackerId || null,
        routines: Array.isArray(raw.routines) ? raw.routines.filter(Boolean).map(r => ({
          id: String(r.id || uid('rtn')),
          name: String(r.name || 'Routine'),
          emoji: String(r.emoji || '🔁'),
          steps: Array.isArray(r.steps) ? r.steps.map(st =>
            typeof st === 'string' ? { id: uid('st'), text: st } : { id: String(st.id || uid('st')), text: String(st.text || '') }
          ).filter(st => st.text.trim()) : []
        })) : [],
        routineLogs: (raw.routineLogs && typeof raw.routineLogs === 'object') ? raw.routineLogs : {},
        todos: (raw.todos && typeof raw.todos === 'object') ? raw.todos : {},
        journals: {}
      };

      // Normalize journals whether stored as object map or legacy array
      if (raw.journals && typeof raw.journals === 'object') {
        if (Array.isArray(raw.journals)) {
          raw.journals.forEach(j => {
            if (j && j.date) {
              s.journals[j.date] = {
                mood: j.mood || 'good',
                text: String(j.text || j.content || ''),
                updatedAt: j.updatedAt || Date.now()
              };
            }
          });
        } else {
          Object.keys(raw.journals).forEach(k => {
            const j = raw.journals[k];
            if (j && typeof j === 'object') {
              s.journals[k] = {
                mood: j.mood || 'good',
                text: String(j.text || j.content || ''),
                updatedAt: j.updatedAt || Date.now()
              };
            }
          });
        }
      }

      if (!['sunlit', 'twilight', 'midnight'].includes(s.settings.theme)) {
        s.settings.theme = 'sunlit';
      }
      if (!s.settings.pin || s.settings.pin.length !== 4) {
        s.settings.pinEnabled = false;
        s.settings.pin = '';
      }
      // Keep activeTrackerId valid (or null if user deleted all challenges)
      if (s.trackers.length === 0) {
        s.activeTrackerId = null;
      } else if (!s.trackers.some(t => t.id === s.activeTrackerId)) {
        s.activeTrackerId = s.trackers[0].id;
      }
      return s;
    }

    function loadState() {
      try {
        const direct = localStorage.getItem(STORAGE_KEY);
        if (direct) return sanitizeState(JSON.parse(direct));
        for (let i = 0; i < LEGACY_KEYS.length; i++) {
          const old = localStorage.getItem(LEGACY_KEYS[i]);
          if (old) {
            const migrated = sanitizeState(JSON.parse(old));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
        }
      } catch (err) {
        showError('Recovered from saved data issue.');
      }
      const fresh = createDefaultState();
      saveState(fresh);
      return fresh;
    }

    function saveState(obj) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(obj || state));
      } catch (err) {
        showError('Storage full — consider exporting a JSON backup.');
      }
    }

    /* =========================================================
       3. RUNTIME UI STATE
       ========================================================= */
    let state = loadState();
    let ui = {
      tab: 'today',
      activeDate: getEffectiveToday(state.settings.cutoffHour),
      category: 'all',
      completedOpen: false,
      expandedRoutines: {},
      journalMoodFilter: 'all',
      journalSearch: '',
      journalDraftDate: null,
      journalDraftMood: 'good',
      journalDraftText: '',
      journalDirty: false,
      deferredInstallPrompt: null,
      isStandalone: window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true
    };

    let confirmPending = null;
    let pinLockBuf = '';
    let pinSetup = { step: 1, first: '', buf: '' };

    // Focus Timer & Offline Web Audio Soundscapes
    let timerState = {
      habitId: null,
      totalSec: 1500,
      remainSec: 1500,
      running: false,
      interval: null,
      sound: 'none',
      audioCtx: null,
      noiseNode: null
    };

    /* =========================================================
       4. HABIT, DAILY % & SMART CHALLENGE SYNC CALCULATIONS
       ========================================================= */
    function getLog(dateStr, habitId) {
      if (!state.logs[dateStr] || !state.logs[dateStr][habitId]) {
        return { status: 'none', value: 0, note: '', skipReason: '' };
      }
      return state.logs[dateStr][habitId];
    }

    function setLog(dateStr, habitId, patch) {
      if (!state.logs[dateStr]) state.logs[dateStr] = {};
      const cur = getLog(dateStr, habitId);
      state.logs[dateStr][habitId] = Object.assign({}, cur, patch);
      saveState();
    }

    function getHabitProgress(habit, log) {
      if (!log || log.status === 'none' || log.status === 'skip') {
        if (habit.type === 'quant' || habit.type === 'timed') {
          const v = Number(log && log.value) || 0;
          return Math.min(1, v / Math.max(1, habit.target));
        }
        return 0;
      }
      if (log.status === 'done' || log.status === 'freeze') return 1;
      if (log.status === 'min') return 0.5;
      return 0;
    }

    function getActiveHabits() {
      return state.habits.filter(h => !h.archived);
    }

    function getDailyStats(dateStr) {
      const active = getActiveHabits();
      if (active.length === 0) {
        return { pct: 0, doneCount: 0, minCount: 0, total: 0 };
      }
      let score = 0;
      let doneCount = 0;
      let minCount = 0;
      active.forEach(h => {
        const log = getLog(dateStr, h.id);
        const p = getHabitProgress(h, log);
        score += p;
        if (log.status === 'done' || log.status === 'freeze' || p >= 1) doneCount++;
        else if (log.status === 'min') minCount++;
      });
      return {
        pct: Math.round((score / active.length) * 100),
        doneCount: doneCount,
        minCount: minCount,
        total: active.length
      };
    }

    function getHabitStreak(habit) {
      const today = getEffectiveToday(state.settings.cutoffHour);
      let streak = 0;
      let cursor = today;
      for (let i = 0; i < 365; i++) {
        const log = getLog(cursor, habit.id);
        const p = getHabitProgress(habit, log);
        if (log.status === 'done' || log.status === 'min' || log.status === 'freeze' || p >= 1) {
          streak++;
        } else if (i === 0) {
          // Today not done yet doesn't break yesterday's streak
        } else {
          break;
        }
        cursor = addDays(cursor, -1);
      }
      return streak;
    }

    function getLinkedHabitsForTracker(tracker) {
      const active = getActiveHabits();
      if (tracker.syncMode === 'all') return active;
      if (tracker.syncMode === 'category') return active.filter(h => h.category === tracker.syncCategory);
      if (tracker.syncMode === 'habits') return active.filter(h => (tracker.syncHabitIds || []).includes(h.id));
      return [];
    }

    function evaluateTrackerDay(tracker, dateStr) {
      const today = getEffectiveToday(state.settings.cutoffHour);
      if (tracker.overrides && tracker.overrides[dateStr]) {
        return tracker.overrides[dateStr];
      }
      if (tracker.syncMode !== 'manual') {
        const linked = getLinkedHabitsForTracker(tracker);
        if (linked.length > 0) {
          let score = 0;
          let anyFreeze = false;
          linked.forEach(h => {
            const log = getLog(dateStr, h.id);
            score += getHabitProgress(h, log);
            if (log.status === 'freeze') anyFreeze = true;
          });
          const pct = Math.round((score / linked.length) * 100);
          const threshold = Number(tracker.syncThreshold) || 70;
          if (pct >= threshold) return 'done';
          if (pct >= 50) return 'min';
          if (anyFreeze) return 'freeze';
        }
      }
      if (dateStr > today) return 'future';
      if (dateStr === today) return 'today';
      return 'missed';
    }

    function getTrackerSummary(tracker) {
      const today = getEffectiveToday(state.settings.cutoffHour);
      let completed = 0;
      let minWins = 0;
      let currentDayIndex = 1;
      for (let i = 0; i < tracker.days; i++) {
        const dStr = addDays(tracker.startDate, i);
        if (dStr === today) currentDayIndex = i + 1;
        else if (dStr < today) currentDayIndex = Math.min(tracker.days, i + 2);
        const st = evaluateTrackerDay(tracker, dStr);
        if (st === 'done' || st === 'freeze') completed++;
        else if (st === 'min') minWins++;
      }
      const pct = Math.round(((completed + minWins * 0.5) / Math.max(1, tracker.days)) * 100);
      const todayStatus = evaluateTrackerDay(tracker, today);
      return { completed, minWins, pct, currentDayIndex, todayStatus };
    }

       5. SPARK COMPANION SVG & CONFETTI
       ========================================================= */

        face = '<circle cx="21" cy="26" r="2.3" fill="#3B1D10"/><circle cx="33" cy="26" r="2.3" fill="#3B1D10"/><path d="M22 33C24.5 36 29.5 36 32 33" stroke="#3B1D10" stroke-width="2.2" stroke-linecap="round"/>';

        + crown
        + '<circle cx="27" cy="30" r="19" fill="url(#spkGrad)"/>'
        + '<circle cx="17.5" cy="31" r="2.6" fill="#FF7C6B" opacity="0.55"/>'
        + '<circle cx="36.5" cy="31" r="2.6" fill="#FF7C6B" opacity="0.55"/>'

    function greetingFor(pct) {
      const hr = new Date().getHours();
      const base = hr < 12 ? 'Good morning' : (hr < 17 ? 'Good afternoon' : 'Good evening');
      if (pct >= 100) return 'All done! Pure momentum 👑';
      if (pct >= 70) return base + ' — almost there! 🔥';
      if (pct > 0) return base + ' — great start! ✨';
      return base + ' — ready when you are ☀️';
    }

    function renderDatePanel() {

    function renderHabitCard(h, dateStr) {
      const log = getLog(dateStr, h.id);
      const prog = getHabitProgress(h, log);
      const pct = Math.round(prog * 100);
      const streak = getHabitStreak(h);
      const catObj = CATEGORIES.find(c => c.id === h.category) || CATEGORIES[2];

      let stateCls = '';
      if (log.status === 'done' || prog >= 1) stateCls = 'state-done';
      else if (log.status === 'min') stateCls = 'state-min';
      else if (log.status === 'freeze') stateCls = 'state-freeze';
      else if (log.status === 'skip') stateCls = 'state-skip';

      let controlHtml = '';
      if (h.type === 'binary' || h.type === 'quit') {
        const icon = log.status === 'done' ? '✓' : (log.status === 'min' ? '½' : (log.status === 'freeze' ? '❄️' : (h.type === 'quit' ? '🛡️' : '')));
        const btnCls = log.status === 'done' ? 'done' : (log.status === 'min' ? 'min' : (log.status === 'freeze' ? 'freeze' : ''));
        controlHtml = '<button type="button" class="check-btn ' + btnCls + '" data-action="toggle-habit" data-id="' + esc(h.id) + '" aria-label="Toggle habit">' + icon + '</button>';
      } else if (h.type === 'quant') {
        const val = Number(log.value) || 0;
        controlHtml = '<div class="stepper">'
          + '<button type="button" class="step-btn" data-action="step-habit" data-id="' + esc(h.id) + '" data-delta="-1" aria-label="Decrease">−</button>'
          + '<span class="step-val">' + val + '/' + h.target + '</span>'
          + '<button type="button" class="step-btn plus" data-action="step-habit" data-id="' + esc(h.id) + '" data-delta="1" aria-label="Increase">+</button>'
          + '</div>';
      } else if (h.type === 'timed') {
        const val = Number(log.value) || 0;
        const isDone = log.status === 'done' || val >= h.target;
        controlHtml = '<button type="button" class="timer-pill-btn ' + (isDone ? 'done' : '') + '" data-action="open-timer" data-id="' + esc(h.id) + '">'
          + (isDone ? '✓ ' + h.target + 'm' : '▶ ' + (val ? val + '/' : '') + h.target + 'm')
          + '</button>';
      }

      const statusTag = log.status === 'min' ? ' · 🟡 Min Win'
        : (log.status === 'freeze' ? ' · ❄️ Frozen'
        : (log.status === 'skip' ? ' · ⏭️ Skipped' + (log.skipReason ? ' (' + esc(log.skipReason) + ')' : '') : ''));

      return '<div class="habit-card ' + stateCls + '">'
        + '<div class="habit-liquid" style="width:' + pct + '%;"></div>'
        + '<div class="habit-main">'
        + '<div class="habit-emoji">' + esc(h.emoji) + '</div>'
        + '<div class="habit-info">'
        + '<div class="habit-title privacy-sensitive">' + esc(h.name) + '</div>'
        + '<div class="habit-meta">'
        + '<span>' + catObj.emoji + ' ' + catObj.label + '</span>'
        + (streak > 0 ? '<span>· 🔥 ' + streak + 'd</span>' : '')
        + (h.unit ? '<span>· ' + esc(h.target + ' ' + h.unit) + '</span>' : '')
        + '<span>' + statusTag + '</span>'
        + '</div>'
        + (log.note ? '<div class="habit-note-preview privacy-sensitive">📝 ' + esc(log.note) + '</div>' : '')
        + '</div>'
        + '</div>'
        + '<div class="habit-controls">'
        + controlHtml
        + '<button type="button" class="more-btn" data-action="open-habit-actions" data-id="' + esc(h.id) + '" aria-label="Habit options">⋮</button>'
        + '</div>'
        + '</div>';
    }

      let html = '<div class="sec-head" style="margin-top:2px;">'

      state.trackers.forEach(trk => {
        const sum = getTrackerSummary(trk);
        const isActive = trk.id === state.activeTrackerId;
        const syncLabel = trk.syncMode === 'all' ? '🔗 Synced: All Habits (≥' + trk.syncThreshold + '%)'
          : (trk.syncMode === 'category' ? '🔗 Synced: ' + trk.syncCategory.toUpperCase() + ' habits (≥' + trk.syncThreshold + '%)'
          : (trk.syncMode === 'habits' ? '🔗 Synced: ' + (trk.syncHabitIds || []).length + ' chosen habits' : '✋ Manual tap check-in'));

        // Show up to 90 tiles directly (or first 90 around current day for huge 365-day challenges)
        const maxTiles = Math.min(trk.days, 100);
        let tilesHtml = '';
        for (let i = 0; i < maxTiles; i++) {
          const dStr = addDays(trk.startDate, i);
          const st = evaluateTrackerDay(trk, dStr);
          const cls = ['day-tile', st];
          if (dStr === today) cls.push('today');
          tilesHtml += '<button type="button" class="' + cls.join(' ') + '" data-action="toggle-tracker-tile" data-id="' + esc(trk.id) + '" data-date="' + dStr + '" title="Day ' + (i + 1) + ' (' + dStr + ')">' + (i + 1) + '</button>';
        }

        html += '<div class="tracker-card ' + (isActive ? 'active-card' : '') + '">'
          + '<div class="tracker-head">'
          + '<div style="min-width:0; flex:1;">'
          + '<div style="font-size:16px; font-weight:800;" class="privacy-sensitive">' + esc(trk.emoji + ' ' + trk.name) + '</div>'
          + '<div class="small muted" style="margin-top:2px;">' + trk.days + ' days · Started ' + esc(trk.startDate) + '</div>'
          + '<div class="small" style="color:var(--accent); font-weight:700; margin-top:4px;">' + esc(syncLabel) + '</div>'
          + '</div>'
          + '<div class="tracker-actions">'
          + (!isActive ? '<button type="button" class="small-action-btn accent" data-action="select-active-tracker" data-id="' + esc(trk.id) + '">Pin</button>' : '<span class="mini-pill accent">Pinned</span>')
          + '<button type="button" class="small-action-btn" data-action="open-tracker-editor" data-id="' + esc(trk.id) + '" aria-label="Edit challenge">✏️</button>'
          + '<button type="button" class="small-action-btn danger" data-action="request-delete-tracker" data-id="' + esc(trk.id) + '" aria-label="Delete challenge">🗑️</button>'
          + '</div>'
          + '</div>'
          + '<div class="row-between small" style="font-weight:800;"><span>' + sum.completed + ' / ' + trk.days + ' days earned' + (sum.minWins ? ' (+' + sum.minWins + ' min)' : '') + '</span><span>' + sum.pct + '%</span></div>'
          + '<div class="hero-bar-wrap" style="margin-top:6px;"><div class="hero-bar-fill ' + (sum.pct >= 100 ? 'complete' : '') + '" style="width:' + sum.pct + '%;"></div></div>'
          + '<div class="tile-grid">' + tilesHtml + '</div>'
          + (trk.days > 100 ? '<div class="small muted mt-8">Showing first 100 days of ' + trk.days + ' · Tap any tile to toggle manually.</div>' : '<div class="small muted mt-8">Tap any day tile to manually toggle done/clear, or let linked habits auto-complete it!</div>')
          + '</div>';

      return html;
    }

    function renderInsightsTab() {
      const today = getEffectiveToday(state.settings.cutoffHour);
      const activeHabits = getActiveHabits();
      const todayStats = getDailyStats(today);

      // Past 7 days consistency & bars
      let weekSum = 0;
      let weekBarsHtml = '';
      for (let i = 6; i >= 0; i--) {
        const dStr = addDays(today, -i);
        const st = getDailyStats(dStr);
        weekSum += st.pct;
        const wd = parseLocalDate(dStr).toLocaleDateString('en-IN', { weekday: 'short' }).slice(0, 2);
        weekBarsHtml += '<div class="wbar-col">'
          + '<span style="font-size:10px; font-weight:800; color:var(--text-3);">' + st.pct + '%</span>'
          + '<div class="wbar-track"><div class="wbar-fill" style="height:' + st.pct + '%;"></div></div>'
          + '<span style="font-size:11px; font-weight:800; color:' + (i === 0 ? 'var(--accent)' : 'var(--text-2)') + ';">' + wd + '</span>'
          + '</div>';
      }
      const weekAvg = Math.round(weekSum / 7);

      // Total check-ins & best streak
      let totalDone = 0;
      Object.keys(state.logs).forEach(dk => {
        const dayObj = state.logs[dk] || {};
        Object.keys(dayObj).forEach(hid => {
          if (dayObj[hid] && (dayObj[hid].status === 'done' || dayObj[hid].status === 'min')) totalDone++;
        });
      });
      const bestStreak = activeHabits.reduce((mx, h) => Math.max(mx, getHabitStreak(h)), 0);

      // 90-day Heatmap
      let heatCells = '';
      for (let i = 89; i >= 0; i--) {
        const dStr = addDays(today, -i);
        const p = getDailyStats(dStr).pct;
        const lvl = p === 0 ? '' : (p < 35 ? 'l1' : (p < 65 ? 'l2' : (p < 95 ? 'l3' : 'l4')));
        heatCells += '<div class="heat-cell ' + lvl + '" title="' + dStr + ': ' + p + '%"></div>';
      }

      let html = '<div class="stats-grid">'
        + '<div class="stat-tile"><div class="stat-lbl">🔥 Best Streak</div><div class="stat-num">' + bestStreak + 'd</div></div>'
        + '<div class="stat-tile"><div class="stat-lbl">📅 7-Day Average</div><div class="stat-num">' + weekAvg + '%</div></div>'
        + '<div class="stat-tile"><div class="stat-lbl">✅ Total Check-ins</div><div class="stat-num">' + totalDone + '</div></div>'
        + '<div class="stat-tile"><div class="stat-lbl">📖 Journal Entries</div><div class="stat-num">' + Object.keys(state.journals).length + '</div></div>'
        + '</div>';

      // Weekly Bar Card
      html += '<div class="card">'
        + '<div class="row-between"><div style="font-weight:800; font-size:15px;">📈 Last 7 Days Momentum</div><span class="mini-pill accent">' + weekAvg + '% avg</span></div>'
        + '<div class="week-bars">' + weekBarsHtml + '</div>'
        + '</div>';

      // 90-Day Heatmap
      html += '<div class="card">'
        + '<div class="row-between"><div style="font-weight:800; font-size:15px;">🟩 90-Day Consistency Map</div><span class="small muted">Less → More</span></div>'
        + '<div class="heatmap-grid">' + heatCells + '</div>'
        + '</div>';

      // Per-Habit Breakdown
      html += '<div class="card">'
        + '<div style="font-weight:800; font-size:15px; margin-bottom:10px;">🎯 Per-Habit Consistency (30d)</div>';
      if (activeHabits.length === 0) {
        html += '<div class="small muted">Add habits on the Today tab to see individual streaks and 30-day scores.</div>';
      } else {
        activeHabits.forEach(h => {
          let hits = 0;
          for (let i = 0; i < 30; i++) {
            const log = getLog(addDays(today, -i), h.id);
            const p = getHabitProgress(h, log);
            if (p >= 1 || log.status === 'done') hits += 1;
            else if (log.status === 'min') hits += 0.5;
          }
          const rate = Math.round((hits / 30) * 100);
          html += '<div style="margin-bottom:10px;">'
            + '<div class="row-between small" style="font-weight:700; margin-bottom:4px;">'
            + '<span class="privacy-sensitive">' + esc(h.emoji + ' ' + h.name) + '</span>'
            + '<span>🔥 ' + getHabitStreak(h) + 'd · ' + rate + '%</span>'
            + '</div>'
            + '<div class="hero-bar-wrap" style="margin-top:0;"><div class="hero-bar-fill ' + (rate >= 80 ? 'complete' : '') + '" style="width:' + rate + '%;"></div></div>'
            + '</div>';
        });
      }
      html += '</div>';

      // Milestone Share Card
      html += '<div class="card">'
        + '<div style="font-weight:800; font-size:15px; margin-bottom:4px;">🏅 Shareable Milestone Card</div>'
        + '<div class="small muted" style="margin-bottom:12px;">Generate a crisp PNG snapshot of your streak and consistency to save or share on WhatsApp.</div>'
        + '<button type="button" class="btn btn-primary btn-full" data-action="generate-milestone">🎨 Generate Milestone PNG</button>'
        + '</div>';

      return html;
    }

    function render(preserveScroll) {
      try {
        const y = preserveScroll ? window.scrollY : 0;
        applyThemeAndPrivacy();

        // Update nav active states
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === ui.tab);
        });

        // Header subtitle
        const sub = document.getElementById('headerSub');
        if (sub) {
          const st = getDailyStats(ui.activeDate);
          sub.textContent = st.total ? (st.pct + '% complete · ' + st.doneCount + '/' + st.total + ' habits') : 'Warm tactile habit companion';
        }

        // Show FAB on Today & Challenges only
        const fab = document.getElementById('fabBtn');
        if (fab) {
          const showFab = (ui.tab === 'today' || ui.tab === 'challenges');
          fab.classList.toggle('hidden', !showFab);
        }

        const view = document.getElementById('mainView');
        if (ui.tab === 'today') view.innerHTML = renderTodayTab();
        else if (ui.tab === 'challenges') view.innerHTML = renderChallengesTab();
        else if (ui.tab === 'journal') view.innerHTML = renderJournalTab();
        else if (ui.tab === 'insights') view.innerHTML = renderInsightsTab();
        else if (ui.tab === 'settings') view.innerHTML = renderSettingsTab();

        if (preserveScroll) {
          window.scrollTo(0, y);
        } else {
          window.scrollTo(0, 0);
        }
      } catch (err) {
        showError('Render error: ' + err.message);
      }
    }

    /* =========================================================
       8. FOCUS TIMER & OFFLINE WEB AUDIO SOUNDSCAPES
       ========================================================= */
    function stopAmbientAudio() {
      try {
        if (timerState.noiseNode) { timerState.noiseNode.stop(); timerState.noiseNode.disconnect(); timerState.noiseNode = null; }
        if (timerState.audioCtx) { timerState.audioCtx.close(); timerState.audioCtx = null; }
      } catch (e) {}
    }

    function startAmbientAudio(kind) {
      stopAmbientAudio();
      if (kind === 'none') return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const bufSize = 2 * ctx.sampleRate;
        const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          if (kind === 'brown') {
            data[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = data[i];
            data[i] *= 2.2;
          } else {
            data[i] = white * 0.28;
          }
        }
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = kind === 'brown' ? 320 : 1200;

        const gain = ctx.createGain();
        gain.gain.value = 0.25;

        src.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        src.start();
        timerState.audioCtx = ctx;
        timerState.noiseNode = src;
      } catch (e) {}
    }

    function playChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(528, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.4);
      } catch (e) {}
    }

    /* =========================================================
       10. MILESTONE PNG GENERATOR & BACKUPS
       ========================================================= */
    function generateMilestonePNG() {
      const today = getEffectiveToday(state.settings.cutoffHour);
      const st = getDailyStats(today);
      const bestStreak = getActiveHabits().reduce((mx, h) => Math.max(mx, getHabitStreak(h)), 0);
      const trk = state.trackers.find(t => t.id === state.activeTrackerId) || state.trackers[0];

      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');

      // Warm gradient backdrop
      const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
      grad.addColorStop(0, '#FAF6F0');
      grad.addColorStop(1, '#F2E3D0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1080);

      // Card container
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(90, 110, 900, 860, 48);
      ctx.fill();

      // Accent top bar
      const agrad = ctx.createLinearGradient(90, 110, 990, 110);
      agrad.addColorStop(0, '#F48442');
      agrad.addColorStop(1, '#D94E2A');
      ctx.fillStyle = agrad;
      ctx.beginPath();
      ctx.roundRect(90, 110, 900, 180, [48, 48, 0, 0]);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 54px -apple-system, sans-serif';
      ctx.fillText('⚡ Momentum', 150, 215);
      ctx.font = '600 28px -apple-system, sans-serif';
      ctx.fillText(friendlyDate(today, today), 150, 260);

      // Main Score
      ctx.fillStyle = '#1F1A17';
      ctx.font = '900 130px -apple-system, sans-serif';
      ctx.fillText(st.pct + '%', 150, 470);
      ctx.fillStyle = '#5D534C';
      ctx.font = '700 34px -apple-system, sans-serif';
      ctx.fillText('Daily Habit Score (' + st.doneCount + '/' + st.total + ' completed)', 150, 530);

      // Streak & Challenge
      ctx.fillStyle = '#E86A33';
      ctx.font = '800 44px -apple-system, sans-serif';
      ctx.fillText('🔥 Best Streak: ' + bestStreak + ' Days', 150, 650);

      if (trk) {
        const sum = getTrackerSummary(trk);
        ctx.fillStyle = '#1F1A17';
        ctx.font = '700 34px -apple-system, sans-serif';
        ctx.fillText('🏆 ' + trk.name + ': ' + sum.completed + '/' + trk.days + ' days (' + sum.pct + '%)', 150, 735);
      }

      ctx.fillStyle = '#8D8177';
      ctx.font = '600 26px -apple-system, sans-serif';
      ctx.fillText('Built one consistent day at a time.', 150, 895);

      canvas.toBlob(blob => {
        if (!blob) return;
        const file = new File([blob], 'momentum-milestone-' + today + '.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'My Momentum Progress' }).catch(() => downloadBlob(blob, file.name));
        } else {
          downloadBlob(blob, file.name);
        }
        toast('🎨 Milestone card ready!');
      }, 'image/png');
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
