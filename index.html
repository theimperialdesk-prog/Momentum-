    /* =========================================================
       13. GLOBAL EVENT LISTENERS & PWA REGISTRATION
       ========================================================= */
    function init() {
      // 1. Primary delegated click listener (bound FIRST so UI never freezes)
      document.addEventListener('click', (e) => {
        try {
          const target = e.target.closest('[data-action]');
          if (!target) return;
          const action = target.getAttribute('data-action');
          const handler = ACTIONS[action];
          if (typeof handler === 'function') {
            handler(target, e);
          }
        } catch (err) {
          showError('Action error: ' + err.message);
        }
      });

      // 2. Delegated change listener (date picker, dropdowns, import file)
      document.addEventListener('change', (e) => {
        try {
          const el = e.target;
          if (!el) return;
          if (el.id === 'nativeDatePicker' && el.value) {
            ui.activeDate = el.value;
            syncJournalDraft(true);
            render(true);
          } else if (el.id === 'editHabitType') {
            const row = document.getElementById('habitTargetRow');
            if (row) row.style.display = (el.value === 'quant' || el.value === 'timed') ? 'flex' : 'none';
          } else if (el.id === 'editTrackerSyncMode') {
            const catRow = document.getElementById('trackerCatRow');
            const habRow = document.getElementById('trackerHabitsRow');
            const thrRow = document.getElementById('trackerThreshRow');
            if (catRow) catRow.style.display = el.value === 'category' ? 'block' : 'none';
            if (habRow) habRow.style.display = el.value === 'habits' ? 'block' : 'none';
            if (thrRow) thrRow.style.display = el.value !== 'manual' ? 'block' : 'none';
          } else if (el.id === 'cutoffSelect') {
            state.settings.cutoffHour = Number(el.value) || 0;
            saveState();
            toast('🌙 Cutoff updated');
          } else if (el.id === 'importFileInput' && el.files && el.files[0]) {
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const parsed = JSON.parse(String(reader.result || '{}'));
                state = sanitizeState(parsed);
                saveState();
                syncJournalDraft(true);
                render(false);
                toast('✅ Backup restored!');
              } catch (err) {
                toast('⚠️ Invalid backup JSON file');
              }
            };
            reader.readAsText(el.files[0]);
          }
        } catch (err) {
          showError('Input error: ' + err.message);
        }
      });

      // 3. Delegated input listener (Journal live draft & search without losing focus)
      document.addEventListener('input', (e) => {
        const el = e.target;
        if (!el) return;
        if (el.id === 'journalTextInput') {
          ui.journalDraftText = el.value;
          ui.journalDirty = true;
          const badge = document.getElementById('journalStatusBadge');
          if (badge) { badge.className = 'mini-pill amber'; badge.textContent = '● Unsaved'; }
        } else if (el.id === 'journalSearchInput') {
          ui.journalSearch = el.value;
          const pos = el.selectionStart;
          render(true);
          const nextEl = document.getElementById('journalSearchInput');
          if (nextEl) { nextEl.focus(); try { nextEl.setSelectionRange(pos, pos); } catch (ex) {} }
        }
      });

      // 4. Keyboard support (Enter on quick task, Escape to close modals)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'quickTodoInput') {
          e.preventDefault();
          ACTIONS['add-todo']();
        } else if (e.key === 'Escape') {
          if (document.getElementById('confirmOverlay').classList.contains('open')) closeConfirm();
          else if (document.getElementById('pinSetupOverlay').classList.contains('open')) closePinSetup();
          else if (document.getElementById('timerOverlay').classList.contains('open')) closeTimerModal();
          else if (document.getElementById('sheetOverlay').classList.contains('open')) closeSheet();
        }
      });

      // 5. Android PWA Install Prompt & Service Worker
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        ui.deferredInstallPrompt = e;
        if (ui.tab === 'settings') render(true);
      });

      window.addEventListener('appinstalled', () => {
        ui.isStandalone = true;
        ui.deferredInstallPrompt = null;
        toast('🎉 Momentum installed on your phone!');
        if (ui.tab === 'settings') render(true);
      });

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
        });
      }

      // 6. Initial Render & PIN Gate
      render(false);
      if (state.settings.pinEnabled && state.settings.pin.length === 4) {
        openPinLock();
      }
    }

    init();
  })();
  </script>
</body>
</html>
